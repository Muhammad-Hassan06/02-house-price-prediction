<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValuHome AI | California Real Estate Valuation Platform</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Inline Critical Glassmorphism Design System -->
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: rgba(15, 23, 42, 0.75);
            --bg-card-hover: rgba(30, 41, 59, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(16, 185, 129, 0.3);
            
            --primary: #10b981;
            --primary-light: #34d399;
            --primary-glow: rgba(16, 185, 129, 0.4);
            --secondary: #3b82f6;
            --amber: #f59e0b;
            --purple: #8b5cf6;
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', 'Outfit', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(59, 130, 246, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            width: 290px;
            background: rgba(11, 17, 32, 0.92);
            backdrop-filter: blur(24px);
            border-right: 1px solid var(--border-color);
            padding: 30px 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: sticky;
            top: 0;
            height: 100vh;
            z-index: 100;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 0 25px var(--primary-glow);
        }

        .brand-title {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--primary-light);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 28px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius-md);
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            text-align: left;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            transform: translateX(4px);
        }

        .nav-btn.active {
            background: rgba(16, 185, 129, 0.16);
            border-color: rgba(16, 185, 129, 0.4);
            color: #6ee7b7;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
        }

        /* Main Wrapper */
        .main-wrapper {
            flex: 1;
            padding: 36px 44px;
            max-width: 1350px;
            margin: 0 auto;
            width: 100%;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 36px;
        }

        .top-bar h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.8px;
            background: linear-gradient(135deg, #ffffff 30%, #a7f3d0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .top-bar p {
            color: var(--text-muted);
            font-size: 0.98rem;
            margin-top: 6px;
        }

        .status-pill {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #6ee7b7;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
        }

        .dot {
            width: 9px;
            height: 9px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 12px #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Glass Cards */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            margin-bottom: 28px;
            transition: var(--transition);
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.14);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #f1f5f9;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        /* Presets Toolbar */
        .preset-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 26px;
            background: rgba(15, 23, 42, 0.7);
            padding: 10px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .preset-btn {
            flex: 1;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }

        .preset-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
        }

        .preset-btn.active {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--primary);
            color: #6ee7b7;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        /* Sliders */
        .slider-group {
            margin-bottom: 22px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .val-badge {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        .range-slider {
            width: 100%;
            height: 8px;
            background: #1e293b;
            border-radius: 6px;
            outline: none;
            accent-color: var(--primary);
            cursor: pointer;
            transition: var(--transition);
        }

        .range-slider::-webkit-slider-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 0 12px var(--primary-glow);
            transition: var(--transition);
        }

        .range-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #0b1120;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 12px 30px -5px rgba(16, 185, 129, 0.45);
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 35px -5px rgba(16, 185, 129, 0.65);
        }

        /* Results Panel */
        .result-box {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.12) 0%, rgba(59, 130, 246, 0.08) 100%);
            border: 1px solid rgba(16, 185, 129, 0.35);
            border-radius: var(--radius-md);
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .result-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 60%);
            pointer-events: none;
        }

        .price-title {
            font-size: 3.2rem;
            font-weight: 800;
            color: #6ee7b7;
            margin: 12px 0;
            font-family: 'Outfit', sans-serif;
            letter-spacing: -1px;
            text-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
        }

        .code-box {
            background: #060911;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 24px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.88rem;
            color: #cbd5e1;
            line-height: 1.7;
            overflow-x: auto;
        }

        @media (max-width: 950px) {
            .app-layout { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; }
            .grid-2 { grid-template-columns: 1fr; }
            .grid-4 { grid-template-columns: 1fr 1fr; }
            .main-wrapper { padding: 24px 20px; }
        }
    </style>
    
    <!-- React 18 & Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <!-- React Application Script -->
    <script type="text/babel">
const { useState, useEffect } = React;

const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
    ? 'http://localhost:8000' 
    : 'https://ai-backend-w52h.onrender.com';

function App() {
    const [activeTab, setActiveTab] = useState('predictor');

    return (
        <div className="app-layout">
            <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} />
            <main className="main-wrapper">
                <Header />
                {activeTab === 'predictor' && <PredictorTab />}
                {activeTab === 'analytics' && <AnalyticsTab />}
                {activeTab === 'specs' && <ModelSpecsTab />}
                {activeTab === 'api' && <ApiTab />}
            </main>
        </div>
    );
}

// ----------------------------------------------------------------------------
// Sidebar Component
// ----------------------------------------------------------------------------
function Sidebar({ activeTab, setActiveTab }) {
    return (
        <aside className="sidebar">
            <div>
                <div className="brand-box">
                    <div className="brand-icon">🏡</div>
                    <div>
                        <h2 className="brand-title">ValuHome AI</h2>
                        <span className="brand-subtitle">Price Estimator</span>
                    </div>
                </div>

                <nav className="nav-list">
                    <button 
                        className={`nav-btn ${activeTab === 'predictor' ? 'active' : ''}`}
                        onClick={() => setActiveTab('predictor')}
                    >
                        <span>🔮 Price Valuation</span>
                    </button>

                    <button 
                        className={`nav-btn ${activeTab === 'analytics' ? 'active' : ''}`}
                        onClick={() => setActiveTab('analytics')}
                    >
                        <span>📊 Dataset Analytics</span>
                    </button>

                    <button 
                        className={`nav-btn ${activeTab === 'specs' ? 'active' : ''}`}
                        onClick={() => setActiveTab('specs')}
                    >
                        <span>🔬 XGBoost Regressor</span>
                    </button>

                    <button 
                        className={`nav-btn ${activeTab === 'api' ? 'active' : ''}`}
                        onClick={() => setActiveTab('api')}
                    >
                        <span>🔌 FastAPI Endpoints</span>
                    </button>
                </nav>
            </div>

            <div style={{ background: 'rgba(15, 23, 42, 0.9)', padding: '16px', borderRadius: '14px', border: '1px solid var(--border-color)' }}>
                <small style={{ color: 'var(--text-muted)', fontSize: '0.72rem', fontWeight: 700, letterSpacing: '1px' }}>MODEL FILE</small>
                <div style={{ fontFamily: 'JetBrains Mono', color: '#6ee7b7', fontSize: '0.82rem', marginTop: '6px', fontWeight: 600 }}>
                    boston_house_price_model.pkl
                </div>
            </div>
        </aside>
    );
}

// ----------------------------------------------------------------------------
// Top Header Component
// ----------------------------------------------------------------------------
function Header() {
    return (
        <header className="top-bar">
            <div>
                <h1>California Real Estate Valuation Platform</h1>
                <p>XGBoost Regression Machine Learning model trained on California Census housing metrics</p>
            </div>
            <div className="status-pill">
                <span className="dot"></span> FastAPI + Model Active
            </div>
        </header>
    );
}

// ----------------------------------------------------------------------------
// 1. Predictor Tab
// ----------------------------------------------------------------------------
function PredictorTab() {
    const [income, setIncome] = useState(5.2);
    const [age, setAge] = useState(25.0);
    const [rooms, setRooms] = useState(5.8);
    const [bedrooms, setBedrooms] = useState(1.1);
    const [population, setPopulation] = useState(1200);
    const [presetActive, setPresetActive] = useState('suburban');

    // Output State
    const [priceUsd, setPriceUsd] = useState(268900);
    const [computationSource, setComputationSource] = useState('FASTAPI'); // 'FASTAPI' | 'LOCAL_DEMO'

    const handlePredict = async () => {
        try {
            const res = await fetch(`${API_BASE_URL}/predict/house-price`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    MedInc: parseFloat(income),
                    HouseAge: parseFloat(age),
                    AveRooms: parseFloat(rooms),
                    AveBedrms: parseFloat(bedrooms),
                    Population: parseFloat(population),
                    AveOccup: 3.0,
                    Latitude: 34.2,
                    Longitude: -118.4
                })
            });

            if (res.ok) {
                const data = await res.json();
                setPriceUsd(data.predicted_price_usd);
                setComputationSource('FASTAPI');
            } else {
                throw new Error('API non-200');
            }
        } catch (err) {
            setComputationSource('LOCAL_DEMO');
            const baseVal = (income * 0.45) + (rooms * 0.09) - (bedrooms * 0.06) + (age * 0.006) + 0.35;
            setPriceUsd(Math.round(Math.max(baseVal, 0.5) * 100000));
        }
    };

    useEffect(() => {
        handlePredict();
    }, [income, age, rooms, bedrooms, population]);

    const applyPreset = (inc, ag, rm, bd, pop, key) => {
        setIncome(inc);
        setAge(ag);
        setRooms(rm);
        setBedrooms(bd);
        setPopulation(pop);
        setPresetActive(key);
    };

    return (
        <div className="grid-2">
            {/* Input Form Panel */}
            <div className="glass-card">
                <h3 className="card-title">⚙️ Housing Attributes</h3>

                {/* Presets Toolbar */}
                <div className="preset-bar">
                    <button 
                        className={`preset-btn ${presetActive === 'suburban' ? 'active' : ''}`}
                        onClick={() => applyPreset(5.2, 25.0, 5.8, 1.1, 1200, 'suburban')}
                    >
                        🏡 Suburban Family
                    </button>
                    <button 
                        className={`preset-btn ${presetActive === 'luxury' ? 'active' : ''}`}
                        onClick={() => applyPreset(10.5, 12.0, 8.2, 1.8, 850, 'luxury')}
                    >
                        👑 Luxury Villa
                    </button>
                    <button 
                        className={`preset-btn ${presetActive === 'budget' ? 'active' : ''}`}
                        onClick={() => applyPreset(2.1, 40.0, 3.5, 0.9, 2100, 'budget')}
                    >
                        🛡️ Budget Condo
                    </button>
                </div>

                <form onSubmit={(e) => { e.preventDefault(); handlePredict(); }}>
                    <div className="slider-group">
                        <div className="slider-header">
                            <span>Median Block Income ($10k units)</span>
                            <span className="val-badge" style={{ color: 'var(--primary-light)' }}>${(income * 10).toFixed(1)}k / yr</span>
                        </div>
                        <input 
                            type="range" 
                            min="0.5" 
                            max="15.0" 
                            step="0.1"
                            value={income} 
                            onChange={(e) => setIncome(e.target.value)}
                            className="range-slider"
                        />
                    </div>

                    <div className="slider-group" style={{ marginTop: '22px' }}>
                        <div className="slider-header">
                            <span>Average Rooms per House</span>
                            <span className="val-badge" style={{ color: 'var(--secondary)' }}>{rooms} Rooms</span>
                        </div>
                        <input 
                            type="range" 
                            min="1.0" 
                            max="12.0" 
                            step="0.1"
                            value={rooms} 
                            onChange={(e) => setRooms(e.target.value)}
                            className="range-slider"
                            style={{ accentColor: 'var(--secondary)' }}
                        />
                    </div>

                    <div className="slider-group" style={{ marginTop: '22px' }}>
                        <div className="slider-header">
                            <span>Median House Age</span>
                            <span className="val-badge" style={{ color: 'var(--amber)' }}>{age} Years</span>
                        </div>
                        <input 
                            type="range" 
                            min="1" 
                            max="52" 
                            value={age} 
                            onChange={(e) => setAge(e.target.value)}
                            className="range-slider"
                            style={{ accentColor: 'var(--amber)' }}
                        />
                    </div>

                    <button type="submit" className="btn-primary">
                        🔮 Calculate Home Valuation
                    </button>
                </form>
            </div>

            {/* Results Output Panel */}
            <div>
                <div className="glass-card">
                    <h3 className="card-title">✨ Estimated Valuation Result</h3>

                    <div style={{ marginBottom: '20px' }}>
                        {computationSource === 'FASTAPI' ? (
                            <span style={{ 
                                background: 'rgba(16, 185, 129, 0.16)', 
                                color: '#6ee7b7', 
                                border: '1px solid rgba(16, 185, 129, 0.4)',
                                padding: '8px 16px', 
                                borderRadius: '30px', 
                                fontSize: '0.84rem', 
                                fontWeight: 700 
                            }}>
                                🟢 Computed by Live FastAPI Backend (main.py)
                            </span>
                        ) : (
                            <span style={{ 
                                background: 'rgba(245, 158, 11, 0.16)', 
                                color: '#fcd34d', 
                                border: '1px solid rgba(245, 158, 11, 0.4)',
                                padding: '8px 16px', 
                                borderRadius: '30px', 
                                fontSize: '0.84rem', 
                                fontWeight: 700 
                            }}>
                                ⚡ Computed by Local Client-Side Engine
                            </span>
                        )}
                    </div>

                    <div className="result-box">
                        <small style={{ color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '1.2px', fontSize: '0.78rem', fontWeight: 700 }}>
                            ESTIMATED MARKET VALUE
                        </small>
                        <div className="price-title">${priceUsd.toLocaleString()}</div>
                        <div style={{ color: 'var(--text-muted)', fontSize: '0.9rem', fontWeight: 500 }}>
                            Based on California Census Block Group Metrics
                        </div>
                    </div>

                    <div style={{ 
                        marginTop: '20px',
                        padding: '14px 18px', 
                        borderRadius: '12px', 
                        fontSize: '0.82rem', 
                        textAlign: 'left',
                        background: computationSource === 'FASTAPI' ? 'rgba(16, 185, 129, 0.08)' : 'rgba(245, 158, 11, 0.08)',
                        color: computationSource === 'FASTAPI' ? '#a7f3d0' : '#fde68a',
                        border: `1px solid ${computationSource === 'FASTAPI' ? 'rgba(16, 185, 129, 0.25)' : 'rgba(245, 158, 11, 0.25)'}`
                    }}>
                        {computationSource === 'FASTAPI' ? (
                            <span>✅ <strong>Source:</strong> Prediction computed via <code>POST https://ai-backend-w52h.onrender.com/predict/house-price</code> executing <code>boston_house_price_model.pkl</code> XGBoost regressor.</span>
                        ) : (
                            <span>⚠️ <strong>Backend Offline:</strong> Render API at <code>https://ai-backend-w52h.onrender.com</code> unreachable. Using local client fallback.</span>
                        )}
                    </div>
                </div>
            </div>
        </div>
    );
}

// ----------------------------------------------------------------------------
// 2. Analytics Tab
// ----------------------------------------------------------------------------
function AnalyticsTab() {
    return (
        <div>
            <div className="grid-4" style={{ marginBottom: '28px' }}>
                <div className="glass-card">
                    <small style={{ color: 'var(--text-muted)', fontWeight: 700 }}>TOTAL RECORDS</small>
                    <div style={{ fontSize: '1.9rem', fontWeight: 800, marginTop: '6px' }}>20,640 Blocks</div>
                </div>
                <div className="glass-card">
                    <small style={{ color: 'var(--text-muted)', fontWeight: 700 }}>ACCURACY (R²)</small>
                    <div style={{ fontSize: '1.9rem', fontWeight: 800, color: 'var(--primary-light)', marginTop: '6px' }}>0.835</div>
                </div>
                <div className="glass-card">
                    <small style={{ color: 'var(--text-muted)', fontWeight: 700 }}>RMSE ERROR</small>
