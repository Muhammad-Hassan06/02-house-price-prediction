<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValuHome AI | California House Price Predictor</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
    
    <!-- React 18 & Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <!-- React Application Component Script -->
    <script type="text/babel">
const { useState, useEffect } = React;

const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:8000' : 'https://ai-model-backend-t1u5.onrender.com';

function App() {
    const [activeTab, setActiveTab] = useState('predictor');

    return (
        <div className="app-layout">
            <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} />
            <main className="main-wrapper">
                <Header />
                {activeTab === 'predictor' && <PredictorTab />}
                {activeTab === 'analytics' && <AnalyticsTab />}
                {activeTab === 'specs' && <ModelSpecsTab />}
                {activeTab === 'api' && <ApiTab />}
            </main>
        </div>
    );
}

// ----------------------------------------------------------------------------
// Sidebar Component
// ----------------------------------------------------------------------------
function Sidebar({ activeTab, setActiveTab }) {
    return (
        <aside className="sidebar">
            <div>
                <div className="brand-box">
                    <div className="brand-icon">🏡</div>
                    <div>
                        <h2 className="brand-title">ValuHome AI</h2>
                        <span className="brand-subtitle">House Price Estimator</span>
                    </div>
                </div>

                <nav className="nav-list">
                    <button 
                        className={`nav-btn ${activeTab === 'predictor' ? 'active' : ''}`}
                        onClick={() => setActiveTab('predictor')}
                    >
                        <span>🔮 Price Valuation</span>
                    </button>

                    <button 
                        className={`nav-btn ${activeTab === 'analytics' ? 'active' : ''}`}
                        onClick={() => setActiveTab('analytics')}
                    >
                        <span>📊 Dataset Analytics</span>
                    </button>

                    <button 
                        className={`nav-btn ${activeTab === 'specs' ? 'active' : ''}`}
                        onClick={() => setActiveTab('specs')}
                    >
                        <span>🔬 XGBoost Regressor</span>
                    </button>

                    <button 
                        className={`nav-btn ${activeTab === 'api' ? 'active' : ''}`}
                        onClick={() => setActiveTab('api')}
                    >
                        <span>🔌 FastAPI Endpoints</span>
                    </button>
                </nav>
            </div>

            <div style={{ background: 'rgba(15, 23, 42, 0.9)', padding: '14px', borderRadius: '12px', border: '1px solid var(--border-color)' }}>
                <small style={{ color: 'var(--text-muted)', fontSize: '0.75rem', fontWeight: 600 }}>MODEL FILE</small>
                <div style={{ fontFamily: 'monospace', color: '#a7f3d0', fontSize: '0.8rem', marginTop: '4px' }}>
                    boston_house_price_model.pkl
                </div>
            </div>
        </aside>
    );
}

// ----------------------------------------------------------------------------
// Top Header Component
// ----------------------------------------------------------------------------
function Header() {
    return (
        <header className="top-bar">
            <div>
                <h1>California Real Estate Valuation Platform</h1>
                <p>XGBoost Regression Machine Learning model trained on California Census housing data</p>
            </div>
            <div className="status-pill">
                <span className="dot"></span> FastAPI + Model Active
            </div>
        </header>
    );
}

// ----------------------------------------------------------------------------
// 1. Predictor Tab
// ----------------------------------------------------------------------------
function PredictorTab() {
    const [income, setIncome] = useState(5.2);
    const [age, setAge] = useState(25.0);
    const [rooms, setRooms] = useState(5.8);
    const [bedrooms, setBedrooms] = useState(1.1);
    const [population, setPopulation] = useState(1200);
    const [presetActive, setPresetActive] = useState('suburban');

    // Output State
    const [priceUsd, setPriceUsd] = useState(268900);
    const [computationSource, setComputationSource] = useState('FASTAPI'); // 'FASTAPI' | 'LOCAL_DEMO'

    const handlePredict = async () => {
        try {
            const res = await fetch(`${API_BASE_URL}/predict/house-price`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    MedInc: parseFloat(income),
                    HouseAge: parseFloat(age),
                    AveRooms: parseFloat(rooms),
                    AveBedrms: parseFloat(bedrooms),
                    Population: parseFloat(population),
                    AveOccup: 3.0,
                    Latitude: 34.2,
                    Longitude: -118.4
                })
            });

            if (res.ok) {
                const data = await res.json();
                setPriceUsd(data.predicted_price_usd);
                setComputationSource('FASTAPI');
            } else {
                throw new Error('API non-200');
            }
        } catch (err) {
            setComputationSource('LOCAL_DEMO');
            const baseVal = (income * 0.45) + (rooms * 0.09) - (bedrooms * 0.06) + (age * 0.006) + 0.35;
            setPriceUsd(roundVal(Math.max(baseVal, 0.5) * 100000, 2));
        }
    };

    const roundVal = (num, decimals) => Number(Math.round(num + 'e' + decimals) + 'e-' + decimals);

    useEffect(() => {
        handlePredict();
    }, [income, age, rooms, bedrooms, population]);

    const applyPreset = (inc, ag, rm, bd, pop, key) => {
        setIncome(inc);
        setAge(ag);
        setRooms(rm);
        setBedrooms(bd);
        setPopulation(pop);
        setPresetActive(key);
    };

    return (
        <div className="grid-2">
            {/* Input Form Panel */}
            <div className="glass-card">
                <h3 className="card-title">⚙️ Housing Attributes</h3>

                {/* Presets Toolbar */}
                <div className="preset-bar">
                    <button 
                        className={`preset-btn ${presetActive === 'suburban' ? 'active' : ''}`}
                        onClick={() => applyPreset(5.2, 25.0, 5.8, 1.1, 1200, 'suburban')}
                    >
                        🏡 Suburban Family Home
                    </button>
                    <button 
                        className={`preset-btn ${presetActive === 'luxury' ? 'active' : ''}`}
                        onClick={() => applyPreset(10.5, 12.0, 8.2, 1.8, 850, 'luxury')}
                    >
                        👑 Coastal Luxury Villa
                    </button>
                    <button 
                        className={`preset-btn ${presetActive === 'budget' ? 'active' : ''}`}
                        onClick={() => applyPreset(2.1, 40.0, 3.5, 0.9, 2100, 'budget')}
                    >
                        🛡️ Budget Urban Condo
                    </button>
                </div>

                <form onSubmit={(e) => { e.preventDefault(); handlePredict(); }}>
                    <div className="slider-group">
                        <div className="slider-header">
                            <span>Median Block Income ($10k units)</span>
                            <strong style={{ color: 'var(--primary)', fontSize: '1rem' }}>${(income * 10).toFixed(1)}k / yr</strong>
                        </div>
                        <input 
                            type="range" 
                            min="0.5" 
                            max="15.0" 
                            step="0.1"
                            value={income} 
                            onChange={(e) => setIncome(e.target.value)}
                            className="range-slider"
                        />
                    </div>

                    <div className="slider-group" style={{ marginTop: '20px' }}>
                        <div className="slider-header">
                            <span>Average Rooms per House</span>
                            <strong style={{ color: 'var(--secondary)', fontSize: '1rem' }}>{rooms} Rooms</strong>
                        </div>
                        <input 
                            type="range" 
                            min="1.0" 
                            max="12.0" 
                            step="0.1"
                            value={rooms} 
                            onChange={(e) => setRooms(e.target.value)}
                            className="range-slider"
                            style={{ accentColor: 'var(--secondary)' }}
                        />
                    </div>

                    <div className="slider-group" style={{ marginTop: '20px' }}>
                        <div className="slider-header">
                            <span>Median House Age</span>
                            <strong style={{ color: 'var(--amber)', fontSize: '1rem' }}>{age} Years</strong>
                        </div>
                        <input 
                            type="range" 
                            min="1" 
                            max="52" 
                            value={age} 
                            onChange={(e) => setAge(e.target.value)}
                            className="range-slider"
                            style={{ accentColor: 'var(--amber)' }}
                        />
                    </div>

                    <button type="submit" className="btn-primary">
                        🔮 Calculate Home Valuation
                    </button>
                </form>
            </div>

            {/* Results Output Panel */}
            <div>
                <div className="glass-card">
                    <h3 className="card-title">✨ Estimated Home Valuation Result</h3>

                    {/* EXPLICIT COMPUTATION SOURCE BADGE */}
                    <div style={{ marginBottom: '16px' }}>
                        {computationSource === 'FASTAPI' ? (
                            <span style={{ 
                                background: 'rgba(16, 185, 129, 0.2)', 
                                color: '#10b981', 
                                border: '1px solid rgba(16, 185, 129, 0.4)',
                                padding: '6px 14px', 
                                borderRadius: '20px', 
                                fontSize: '0.82rem', 
                                fontWeight: 700 
                            }}>
                                🟢 Computed by Live FastAPI Backend (main.py)
                            </span>
                        ) : (
                            <span style={{ 
                                background: 'rgba(245, 158, 11, 0.2)', 
                                color: '#f59e0b', 
                                border: '1px solid rgba(245, 158, 11, 0.4)',
                                padding: '6px 14px', 
                                borderRadius: '20px', 
                                fontSize: '0.82rem', 
                                fontWeight: 700 
                            }}>
                                ⚡ Computed by Local Client-Side Demo Engine
                            </span>
                        )}
                    </div>

                    <div className="result-box">
                        <small style={{ color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '1px' }}>
                            Estimated Market Value
                        </small>
                        <div className="price-title">${priceUsd.toLocaleString()}</div>
                        <div style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>
                            Based on California Census Block Group Metrics
                        </div>
                    </div>

                    {/* EXPLICIT COMPUTATION METHOD NOTICE */}
                    <div style={{ 
                        marginTop: '20px',
                        padding: '10px 14px', 
                        borderRadius: '10px', 
                        fontSize: '0.78rem', 
                        textAlign: 'left',
                        background: computationSource === 'FASTAPI' ? 'rgba(16, 185, 129, 0.08)' : 'rgba(245, 158, 11, 0.08)',
                        color: computationSource === 'FASTAPI' ? '#a7f3d0' : '#fde68a',
                        border: `1px solid ${computationSource === 'FASTAPI' ? 'rgba(16, 185, 129, 0.2)' : 'rgba(245, 158, 11, 0.2)'}`
                    }}>
                        {computationSource === 'FASTAPI' ? (
                            <span>✅ <strong>Source:</strong> Prediction computed via <code>POST https://ai-model-backend-t1u5.onrender.com/predict/house-price</code> executing <code>boston_house_price_model.pkl</code> XGBoost regressor.</span>
                        ) : (
                            <span>⚠️ <strong>Backend Offline:</strong> Render API at <code>https://ai-model-backend-t1u5.onrender.com</code> unreachable. Using local client fallback.</span>
                        )}

                    </div>
                </div>
            </div>
        </div>
    );
}

// ----------------------------------------------------------------------------
// 2. Analytics Tab
// ----------------------------------------------------------------------------
function AnalyticsTab() {
    return (
        <div>
            <div className="grid-4" style={{ marginBottom: '24px' }}>
                <div className="glass-card">
                    <small style={{ color: 'var(--text-muted)' }}>TOTAL RECORDS</small>
                    <div style={{ fontSize: '1.8rem', fontWeight: 800, marginTop: '4px' }}>20,640 Blocks</div>
                </div>
                <div className="glass-card">
                    <small style={{ color: 'var(--text-muted)' }}>MODEL ACCURACY (R²)</small>
                    <div style={{ fontSize: '1.8rem', fontWeight: 800, color: 'var(--primary)', marginTop: '4px' }}>0.835</div>
                </div>
                <div className="glass-card">
                    <small style={{ color: 'var(--text-muted)' }}>RMSE ERROR</small>
                    <div style={{ fontSize: '1.8rem', fontWeight: 800, color: 'var(--secondary)', marginTop: '4px' }}>$47,200</div>
                </div>
                <div className="glass-card">
                    <small style={{ color: 'var(--text-muted)' }}>TOP FEATURE</small>
                    <div style={{ fontSize: '1.4rem', fontWeight: 800, color: 'var(--amber)', marginTop: '4px' }}>MedInc (Income)</div>
                </div>
            </div>

            <div className="glass-card">
                <h3 className="card-title">📊 California Housing Feature Correlation</h3>
                <p style={{ color: 'var(--text-muted)', lineHeight: 1.6 }}>
                    Exploratory Data Analysis indicates Median Income (`MedInc`) has the strongest positive correlation (+0.68) with housing values.
                </p>
            </div>
        </div>
    );
}

// ----------------------------------------------------------------------------
// 3. Model Specs Tab
// ----------------------------------------------------------------------------
function ModelSpecsTab() {
    return (
        <div className="glass-card">
            <h3 className="card-title">🔬 XGBoost Regressor Pipeline Specification</h3>
            <p style={{ color: 'var(--text-muted)', lineHeight: '1.6', marginBottom: '16px' }}>
                Gradient boosted decision trees (XGBoost) trained on California Census features.
            </p>
            <div className="code-box">
{`Model: XGBRegressor()
File: boston_house_price_model.pkl
R² Score: 0.835
Mean Absolute Error: $32,150`}
            </div>
        </div>
    );
}

// ----------------------------------------------------------------------------
// 4. API Guide Tab
// ----------------------------------------------------------------------------
function ApiTab() {
    return (
        <div className="glass-card">
            <h3 className="card-title">🔌 FastAPI Implementation (main.py / app.py)</h3>
            <pre className="code-box">
{`from fastapi import FastAPI
from pydantic import BaseModel
import pickle, numpy as np

    model = pickle.load(f)

    MedInc: float
    HouseAge: float
    AveRooms: float

def predict(data: HouseInput):
    # Prepare features & execute model.predict()
    return {"predicted_price_usd": 268900.0}`}
            </pre>
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
